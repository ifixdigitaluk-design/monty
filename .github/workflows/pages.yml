name: Download site (GitHub Pages)

# Publishes site/ to GitHub Pages: a small page linking to the web app and the latest Windows installer.
# One-time setup: Settings → Pages → Source: GitHub Actions. Uses the repository variable MONTY_URL.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deployment.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - name: Fill in addresses
        env:
          MONTY_URL: ${{ vars.MONTY_URL }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p _site && cp -r site/. _site/
          sed -i "s#__MONTY_URL__#${MONTY_URL:-#}#g; s#__REPO__#${REPO}#g" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
