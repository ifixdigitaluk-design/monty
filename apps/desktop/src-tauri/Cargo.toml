[package]
name = "monty-desktop"
version = "0.1.0"
edition = "2021"
description = "Monty desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
url = "2"

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
strip = true
